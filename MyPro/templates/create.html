{% extends 'base.html' %}

{% block title %}
Home
{% endblock %}

{% block content %}
<form method="post">
    <div>
        {{ErrorMessage}}
    </div>
    {% csrf_token %}
    <div class="row" style="background-color: green;color: aqua;margin-bottom: 20px;text-align: center;">
        <div class="col-sm-12">
            <h1>Employee Registration</h1>
        </div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-4"></div>
        <div class="col-sm-2">
            <b>Name</b>
        </div>
        <div class="col-sm-3">
            <input type="text" id="txtEname" name="txtEname" class="form-control" placeholder="Enter name...!" />
        </div>
        <div class="col-sm-4"></div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-4"></div>
        <div class="col-sm-2">
            <b>Password</b>
        </div>
        <div class="col-sm-3">
            <input type="password" id="txtPwd" name="txtPwd" class="form-control" placeholder="Enter password...!" />
        </div>
        <div class="col-sm-4"></div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-4"></div>
        <div class="col-sm-2">
            <b>Gender</b>
        </div>
        <div class="col-sm-3">
            <input type="radio" id="rbtnMale" name="Gender" value="Male" /><span>Male</span>
            <input type="radio" id="rbtnFemale" name="Gender" value="Female" /><span>Female</span>
        </div>
        <div class="col-sm-4"></div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-4"></div>
        <div class="col-sm-2">
            <b>Phone</b>
        </div>
        <div class="col-sm-3">
            <input type="text" id="txtPhone" name="txtPhone" class="form-control"
                placeholder="Enter phone number...!" />
        </div>
        <div class="col-sm-4"></div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-4"></div>
        <div class="col-sm-2">
            <b>Emai;</b>
        </div>
        <div class="col-sm-3">
            <input type="text" id="txtEmail" name="txtEmail" class="form-control"
                placeholder="Enter email address...!" />
        </div>
        <div class="col-sm-4"></div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-4"></div>
        <div class="col-sm-2">
            <b>DOB</b>
        </div>
        <div class="col-sm-3">
            <input type="date" id="txtDOB" name="txtDOB" class="form-control" placeholder="Enter Date of birth...!" />
        </div>
        <div class="col-sm-4"></div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-4"></div>
        <div class="col-sm-2">
            <b>Salary</b>
        </div>
        <div class="col-sm-3">
            <input type="text" id="txtSalary" name="txtSalary" class="form-control" placeholder="Enter salary...!" />
        </div>
        <div class="col-sm-4"></div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-4"></div>
        <div class="col-sm-2">
            <b>Address</b>
        </div>
        <div class="col-sm-3">
            <textarea id="txtAddress" name="txtAddress" class="form-control" placeholder="Enter address...!"
                rows="3"></textarea>
        </div>
        <div class="col-sm-4"></div>
    </div>
    <div class="row" style="margin-bottom: 10px;">
        <div class="col-sm-4"></div>
        <div class="col-sm-2">
            <b>Department</b>
        </div>
        <div class="col-sm-3">
            <select id="ddlDeptNo" name="ddlDeptNo" class="form-control">
                <option value="0">-Select Department-</option>
                {% for dept in data %}
                    <option value="{{dept.DeptNo}}">{{dept.DeptNo}} - {{dept.Dname}} - {{dept.Location}}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-sm-4"></div>
    </div>
    <div class="row" style="text-align: center;">
        <div class="col-sm-12">
            <input type="submit" id="btnRegister" name="Register" value="Register" class="btn btn-primary" />
            <input type="submit" id="btnCancel" name="Register" value="Cancel" class="btn btn-danger" />
        </div>
    </div>
</form>
{% endblock %}
